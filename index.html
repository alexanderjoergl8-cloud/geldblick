/* Gestaltungsplan: ruhiges Haushaltsbuch. Kühles Papier, Tannengrün als Marke, drei feste Datenfarben
   (Einnahmen grün, Ausgaben orange, Sparen blau). Handy: Kopf + Inhalt + untere Leiste. PC: Seitenleiste. */
:root {
  --bg: #f1f4f1; --surface: #ffffff; --surface-2: #f6f8f6; --ink: #15201d; --muted: #5a6763; --line: #dce3df;
  --brand: #173f3a; --on-brand: #f1f7f4; --brand-soft: #e2ece8;
  --inc: #1baf7a; --exp: #eb6834; --sav: #2a78d6; --free: #9fb0aa;
  --good: #14784f; --good-bg: #e3f4eb; --warn: #9a5b00; --warn-bg: #fcf1d9; --crit: #b62f2b; --crit-bg: #fce8e6; --info: #2c5f9e; --info-bg: #e8eff8;
  --shadow: 0 1px 2px rgba(21, 32, 29, .06), 0 6px 20px rgba(21, 32, 29, .06);
  --f-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #171f1d; --surface-2: #1d2725; --ink: #e8efec; --muted: #9babA6; --line: #2a3633;
  --brand: #1f4a44; --on-brand: #eef6f2; --brand-soft: #1c2d2a;
  --inc: #199e70; --exp: #d95926; --sav: #3987e5; --free: #53635e;
  --good: #58c79a; --good-bg: #14302a; --warn: #e3a643; --warn-bg: #33280f; --crit: #f0847c; --crit-bg: #3a1c1a; --info: #86b3ee; --info-bg: #17263a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #171f1d; --surface-2: #1d2725; --ink: #e8efec; --muted: #9baba6; --line: #2a3633;
  --brand: #1f4a44; --on-brand: #eef6f2; --brand-soft: #1c2d2a;
  --inc: #199e70; --exp: #d95926; --sav: #3987e5; --free: #53635e;
  --good: #58c79a; --good-bg: #14302a; --warn: #e3a643; --warn-bg: #33280f; --crit: #f0847c; --crit-bg: #3a1c1a; --info: #86b3ee; --info-bg: #17263a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--sav); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* Grundgerüst */
.app { display: flex; height: 100%; }
.side { display: none; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); min-height: 56px; }
.top h1 { font-size: 20px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; margin-left: -8px; }
.msw { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.msw button { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; }
.msw button:disabled { opacity: .3; cursor: default; }
.msw .ml { width: auto; padding: 0 6px; font-weight: 600; font-size: 14px; min-width: 104px; text-align: center; display: block; }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 104px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px max(4px, env(safe-area-inset-bottom)); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 5px; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 10px; }
.nav button[aria-current="page"] { color: var(--brand); }
:root[data-theme="dark"] .nav button[aria-current="page"], :root[data-theme="dark"] .side button[aria-current="page"] { color: var(--good); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav button[aria-current="page"], :root:not([data-theme="light"]) .side button[aria-current="page"] { color: var(--good); } }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.fab { position: fixed; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom)); height: 56px; padding: 0 20px 0 16px; border-radius: 18px; background: var(--brand); color: var(--on-brand); display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: 0 6px 18px rgba(23, 63, 58, .35); z-index: 5; }

/* Bausteine */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card > h2, .sec > h2 { font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.card > h2 .link, .sec > h2 .link { margin-left: auto; font: 600 13px var(--f-body); color: var(--info); letter-spacing: 0; }
.sub { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid2 > * { min-width: 0; }
.hero { background: var(--brand); color: var(--on-brand); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .lbl { font-size: 13px; opacity: .8; font-weight: 600; }
.hero .big { font: 700 42px/1 var(--f-display); letter-spacing: -.02em; margin-top: 4px; }
.hero .big.neg { color: #ffb4a8; }
.hero .meter { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; }
.hero .meter i { display: block; height: 100%; background: var(--on-brand); border-radius: 3px; }
.hero .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero .kv b { display: block; font: 700 18px var(--f-display); }
.hero .kv span { font-size: 12px; opacity: .8; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile .k { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .v { font: 700 19px var(--f-display); }
.tile .d { font-size: 12px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.split { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
.split i { display: block; min-width: 3px; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend b { color: var(--ink); font-weight: 600; }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); width: 100%; min-height: 48px; }
.list > .row:first-child, .dayh + .row { border-top: 0; }
.row .mono { width: 36px; height: 36px; border-radius: 11px; background: var(--brand-soft); color: var(--ink); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; }
.row .mono.inc { background: var(--good-bg); color: var(--good); }
.row .mono.pot { background: var(--info-bg); color: var(--info); }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx .pl { white-space: normal; overflow: visible; margin-top: 4px; }
.row .am { font-weight: 700; text-align: right; }
.row .am small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.am.plus { color: var(--good); }
.off { opacity: .55; }
.dayh { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 14px 0 2px; border-top: 1px solid var(--line); }

<div id="app" class="app"></div>
<noscript>Diese App braucht JavaScript.</noscript>
<script>
/* Rechenkern der Finanz-App. Reine Funktionen, keine Oberfläche.
   Alle Beträge sind ganze Cent. Monate sind 'JJJJ-MM', Tage 'JJJJ-MM-TT'. */
(function (root) {
  'use strict';
  const C = {};
  const pad = n => String(n).padStart(2, '0');
  const NB = ' ';
  C.MONATE = ['Jänner', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  C.MON = ['Jän', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  C.IKINDS = { lohn: 'Gehalt / Lohn', geschenk: 'Geschenk', refund: 'Rückzahlung', sonder: 'Sonderzahlung', neben: 'Nebeneinkommen', sonst: 'Sonstiges' };
  C.PAYS = { '': '–', karte: 'Bankomatkarte', bar: 'Bargeld', kredit: 'Kreditkarte', ueberw: 'Überweisung' };
  C.RHYTHM = { 1: 'monatlich', 3: 'alle 3 Monate', 6: 'halbjährlich', 12: 'jährlich' };

  /* ---------- Geld ---------- */
  C.parseAmount = function (s) {
    if (typeof s === 'number') return Number.isFinite(s) ? Math.round(s * 100) : null;
    s = String(s == null ? '' : s).replace(/[€\s ]/g, '');
    if (!s) return null;
    let neg = false;
    if (s[0] === '-' || s[0] === '−') { neg = true; s = s.slice(1); } else if (s[0] === '+') s = s.slice(1);
    if (!/^[\d.,]+$/.test(s)) return null;
    const lc = s.lastIndexOf(','), lp = s.lastIndexOf('.');
    let int, frac = '';
    if (lc >= 0 && lp >= 0) { const d = Math.max(lc, lp); int = s.slice(0, d).replace(/[.,]/g, ''); frac = s.slice(d + 1); }
    else if (lc >= 0) { if (s.indexOf(',') !== lc) return null; int = s.slice(0, lc); frac = s.slice(lc + 1); }
    else if (lp >= 0) {
      const p = s.split('.');
      const thousands = p.length > 2 || (p[1].length === 3 && p[0].length >= 1 && p[0].length <= 3 && p[0] !== '0');
      if (thousands) { if (!p.slice(1).every(x => x.length === 3)) return null; int = p.join(''); }
      else { int = p[0]; frac = p[1]; }
    } else int = s;
    if (frac.length > 2 || !/^\d*$/.test(frac) || !/^\d*$/.test(int) || (!int && !frac)) return null;
    const c = parseInt(int || '0', 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (!Number.isSafeInteger(c)) return null;
    return neg ? -c : c;
  };
  C.num = function (c, dec) {
    const neg = c < 0; c = Math.abs(Math.round(c));
    const whole = dec === 0 ? Math.round(c / 100) : Math.floor(c / 100);
    const s = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '−' : '') + s + (dec === 0 ? '' : ',' + pad(c % 100));
  };
  C.fmt = c => C.num(c) + NB + '€';
  C.fmt0 = c => C.num(c, 0) + NB + '€';
  C.fmtSigned = c => (c > 0 ? '+' : '') + C.fmt(c);
  C.inputVal = c => (c == null ? '' : C.num(c).replace(/\./g, '').replace('−', '-'));

  /* ---------- Datum ---------- */
  C.mi = k => (+k.slice(0, 4)) * 12 + (+k.slice(5, 7)) - 1;
  C.mk = i => Math.floor(i / 12) + '-' + pad(i % 12 + 1);
  C.addM = (k, n) => C.mk(C.mi(k) + n);
  C.daysIn = k => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();
  C.monthOf = d => d.slice(0, 7);
  C.dayOf = d => +d.slice(8, 10);
  C.todayStr = function (d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  C.dateStr = (k, day) => k + '-' + pad(Math.min(day, C.daysIn(k)));
  C.monthName = k => C.MONATE[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
  C.monShort = k => C.MON[+k.slice(5, 7) - 1] + ' ' + k.slice(2, 4);
  C.fmtDate = d => d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4);
  C.fmtDay = function (d) {
    const dt = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
    return ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][dt.getDay()] + ', ' + (+d.slice(8, 10)) + '. ' + C.MONATE[dt.getMonth()];
  };
  C.validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') && C.dayOf(d) >= 1 && C.dayOf(d) <= C.daysIn(C.monthOf(d)) && +d.slice(5, 7) >= 1 && +d.slice(5, 7) <= 12;
  C.id = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  /* ---------- "gültig ab"-Verläufe ---------- */
  C.verAt = function (vs, k) { let r = null; for (const v of vs || []) { if (v.from <= k) r = v; else break; } return r; };
  C.setVer = function (vs, from, amount, extra) {
    const out = (vs || []).filter(v => v.from !== from);
    out.push(Object.assign({ from: from, amount: amount }, extra || {}));
    out.sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0));
    return out;
  };
  C.amtAt = (vs, k) => { const v = C.verAt(vs, k); return v ? v.amount : 0; };

  /* ---------- Startzustand ---------- */
  C.DEFAULT_CATS = [
    ['Lebensmittel', true], ['Auto & Tanken', true], ['Wohnen & Haushalt', true], ['Gesundheit', true],
    ['Kleidung', false], ['Beauty', false], ['Restaurant & Ausgehen', false], ['Freizeit & Hobbys', false],
    ['Urlaub', false], ['Shopping', false], ['Haustiere', false], ['Sonstiges', false]
  ];
  C.newState = function (today, opening) {
    return {
      v: 1,
      meta: { start: C.monthOf(today), openDate: today, opening: opening || 0, created: today, updated: 0, lastBackup: 0, dirty: 0, demo: false, setup: false },
      set: { warn: [80, 100], theme: 'auto', totalBudget: [], goal: [] },
      cats: C.DEFAULT_CATS.map((c, i) => ({ id: 'c' + (i + 1), name: c[0], need: c[1], budget: [] })),
      rec: [], ov: {}, tx: [], pots: [], alloc: {}, moves: []
    };
  };
  C.migrate = function (s) {
    if (!s || typeof s !== 'object' || !s.meta || !Array.isArray(s.tx) || !Array.isArray(s.cats)) throw new Error('Keine gültige Sicherung dieser App.');
    if ((s.v || 0) > 1) throw new Error('Diese Sicherung stammt aus einer neueren App-Version. Bitte zuerst die App aktualisieren.');
    s.v = 1;
    s.set = Object.assign({ warn: [80, 100], theme: 'auto', totalBudget: [], goal: [] }, s.set || {});
    for (const k of ['rec', 'pots', 'moves']) if (!Array.isArray(s[k])) s[k] = [];
    for (const k of ['ov', 'alloc']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
    if (!C.validDate(s.meta.openDate)) throw new Error('Sicherung beschädigt: Startdatum fehlt.');
    s.meta.start = C.monthOf(s.meta.openDate);
    return s;
  };

  /* ---------- Wiederkehrendes (Fixkosten, Gehalt) ---------- */
  // Liefert den Stand eines wiederkehrenden Postens im Budgetmonat M oder null, wenn er dort nicht existiert.
  C.recInfo = function (st, r, M) {
    const shift = r.kind === 'inc' && r.shift ? 1 : 0;
    const pm = shift ? C.addM(M, -1) : M;                 // Monat der tatsächlichen Zahlung
    const v = C.verAt(r.versions, pm);
    if (!v) return null;
    if (r.end && pm > r.end) return null;
    const iv = r.interval || 1;
    const k = (((C.mi(pm) - C.mi(r.anchor || r.versions[0].from)) % iv) + iv) % iv;   // 0 = fällig
    const due = k === 0, ov = (st.ov || {})[r.id + '|' + M] || null;
    let amount = v.amount, skipped = false, overridden = false, excluded = false;
    if (due && ov) { if (ov.skip) skipped = true; else if (ov.amount != null) { amount = ov.amount; overridden = true; } }
    if (due && M === st.meta.start && (shift || (r.day || 1) < C.dayOf(st.meta.openDate))) excluded = true; // steckt schon im Startguthaben
    return { r: r, base: v.amount, amount: amount, due: due, k: k, iv: iv, paused: !!v.paused, skipped: skipped, overridden: overridden, excluded: excluded, day: Math.min(r.day || 1, C.daysIn(pm)), payMonth: pm };
  };
  const share = (A, j, iv) => Math.floor(A * j / iv) - Math.floor(A * (j - 1) / iv);   // centgenaue Aufteilung
  C.potPlan = function (p, M) { if (p.arch && p.archFrom && M >= p.archFrom) return 0; const v = C.verAt(p.plan, M); return v && !v.paused ? v.amount : 0; };
  C.potSince = (st, p) => (p.since && p.since > st.meta.start ? p.since : st.meta.start);

  /* ---------- Gesamtrechnung über alle Monate ---------- */
  C.compute = function (st, today, upto) {
    const cur = C.monthOf(today), start = st.meta.start;
    let last = cur > start ? cur : start;
    if (upto && upto > last) last = upto;
    const txBy = {}, mvBy = {};
    for (const t of st.tx) { const m = C.monthOf(t.d); (txBy[m] = txBy[m] || []).push(t); if (m > last) last = m; }
    for (const m of st.moves) { const k = C.monthOf(m.d); (mvBy[k] = mvBy[k] || []).push(m); if (k > last) last = k; }
    const res = { months: {}, order: [], today: today, cur: cur, start: start, pots: {} };
    let carry = st.meta.opening || 0, deficitPrev = Math.max(0, -carry);
    const reserve = {}, potBal = {};
    for (const p of st.pots) potBal[p.id] = 0;
    let wealthPrev = carry;
    for (let i = C.mi(start); i <= C.mi(last); i++) {
      const M = C.mk(i);
      const R = { key: M, incItems: [], fixItems: [], income: 0, incomeRec: 0, incomeTx: 0, incByKind: {}, refunds: 0,
        fixed: 0, fixedCash: 0, variable: 0, potSpent: 0, byCat: {}, alloc: {}, plan: {}, saved: 0, savedPlan: 0,
        toPots: 0, fromPots: 0, extIn: 0, carryIn: carry, n: 0 };
      const cat = id => (R.byCat[id || '_'] = R.byCat[id || '_'] || { spent: 0, pot: 0, n: 0 });
      // regelmäßige Einnahmen und Fixkosten
      for (const r of st.rec) {
        const f = C.recInfo(st, r, M);
        if (r.kind === 'inc') {
          if (!f || !f.due || f.paused) continue;
          const it = { id: r.id, name: r.name, amount: f.amount, day: f.day, excluded: f.excluded, skipped: f.skipped, overridden: f.overridden, shift: !!r.shift, counted: !(f.excluded || f.skipped) };
          R.incItems.push(it);
          if (it.counted) { R.incomeRec += f.amount; R.incByKind.lohn = (R.incByKind.lohn || 0) + f.amount; }
          continue;
        }
        if (!f) {                                           // beendet: Rest-Rücklage zurück ins freie Geld
          if (reserve[r.id]) { R.fixItems.push({ id: r.id, name: r.name + ' (Rücklage aufgelöst)', charge: -reserve[r.id], cash: 0, amount: 0, due: false, release: true }); R.fixed -= reserve[r.id]; reserve[r.id] = 0; }
          continue;
        }
        const active = !f.paused, pays = f.due && active && !f.skipped && !f.excluded;
        let charge = 0, cash = 0, accrual = 0, shortfall = 0;

/* ---------- Speicher: IndexedDB, sonst localStorage, sonst nur Arbeitsspeicher ---------- */
const Store = {
  mode: 'mem', db: null, mem: {},
  init() {
    return new Promise(res => {
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      try {
        const rq = indexedDB.open('geldblick', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { Store.db = rq.result; Store.mode = 'idb'; fin(); };
        rq.onerror = rq.onblocked = () => { Store.fallback(); fin(); };
        setTimeout(() => { if (!done) { Store.fallback(); fin(); } }, 2500);
      } catch (e) { Store.fallback(); fin(); }
    });
  },
  fallback() { if (Store.db) return; try { localStorage.setItem('gb.t', '1'); localStorage.removeItem('gb.t'); Store.mode = 'ls'; } catch (e) { Store.mode = 'mem'; } },
  get(k) {
    return new Promise(res => {
      if (Store.mode === 'idb') { try { const rq = Store.db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result == null ? null : rq.result); rq.onerror = () => res(null); } catch (e) { res(null); } }
      else if (Store.mode === 'ls') { try { res(JSON.parse(localStorage.getItem('gb.' + k))); } catch (e) { res(null); } }
      else res(Store.mem[k] == null ? null : Store.mem[k]);
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (Store.mode === 'idb') { try { const tx = Store.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); } }
      else if (Store.mode === 'ls') { try { localStorage.setItem('gb.' + k, JSON.stringify(v)); res(true); } catch (e) { res(false); } }
      else { Store.mem[k] = v; res(true); }
    });
  },
  del(k) {
    return new Promise(res => {
      if (Store.mode === 'idb') { try { const tx = Store.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = tx.onerror = () => res(); } catch (e) { res(); } }
      else if (Store.mode === 'ls') { try { localStorage.removeItem('gb.' + k); } catch (e) { } res(); }
      else { delete Store.mem[k]; res(); }
    });
  },
  keys() {
    return new Promise(res => {
      if (Store.mode === 'idb') { try { const rq = Store.db.transaction('kv').objectStore('kv').getAllKeys(); rq.onsuccess = () => res(rq.result.map(String)); rq.onerror = () => res([]); } catch (e) { res([]); } }
      else if (Store.mode === 'ls') { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.indexOf('gb.') === 0) out.push(k.slice(3)); } } catch (e) { } res(out); }
      else res(Object.keys(Store.mem));
    });
  }
};
let saveT = null, saveFail = false;
function persist() { clearTimeout(saveT); saveT = setTimeout(flush, 200); }
function flush() {
  clearTimeout(saveT); saveT = null;
  if (!S) return Promise.resolve();
  return Store.set('state', JSON.parse(JSON.stringify(S))).then(ok => { if (!ok && !saveFail) { saveFail = true; toast('Speichern fehlgeschlagen. Bitte gleich eine Sicherung erstellen.'); } });
}
function dailySnapshot() {     // ein Stand pro Tag, die letzten 7 bleiben
  if (!S) return;
  const k = 'snap:' + today();
  Store.get(k).then(v => { if (!v) return Store.set(k, JSON.parse(JSON.stringify(S))); })
    .then(() => Store.keys()).then(ks => { ks = ks.filter(x => x.indexOf('snap:') === 0).sort(); while (ks.length > 7) Store.del(ks.shift()); });
}
function askPersist() {
  if (persisted !== null || IS_FRAME || !navigator.storage || !navigator.storage.persist) return;
  persisted = false; navigator.storage.persist().then(ok => { persisted = !!ok; }).catch(() => { });
}

/* ---------- Ändern, Rechnen, Anzeigen ---------- */
function commit(fn, msg, undo) {
  fn(S); S.meta.updated = Date.now(); S.meta.dirty = (S.meta.dirty || 0) + 1;
  persist(); refresh(); if (msg) toast(msg, undo); askPersist();
}
function refresh() { if (S) { U.month = monthClamp(U.month || curM()); comp = C.compute(S, today(), U.month); } render(); }
let toastT = null;
function toast(msg, undo) {
  let el = $('.toast'); if (el) el.remove();
  el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">Rückgängig</button>' : '');
  if (undo) el.querySelector('button').onclick = () => { el.remove(); undo(); };
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), undo ? 6000 : 2600);
}
function go(tab) { if (location.hash !== '#' + tab) { try { location.hash = tab; return; } catch (e) { } } U.tab = tab; render(); const m = $('main'); if (m) m.scrollTop = 0; }

/* ---------- Eingabe-Blatt ---------- */
let sheetEl = null, sheetPushed = false, ignorePop = 0, formCtx = null;
function openSheet(title, body, foot, onMount) {
  if (!sheetEl) {
    sheetEl = document.createElement('div'); sheetEl.className = 'ov'; document.body.appendChild(sheetEl);
    sheetEl.addEventListener('mousedown', e => { if (e.target === sheetEl) closeSheet(); });
    try { history.pushState({ sheet: 1 }, ''); sheetPushed = true; } catch (e) { sheetPushed = false; }
  }
  sheetEl.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><header><h2>' + esc(title) + '</h2><button type="button" class="x" data-a="close" aria-label="Schließen">' + ic('x') + '</button></header><div class="body">' + body + '</div>' + (foot ? '<footer>' + foot + '</footer>' : '') + '</div>';
  if (onMount) onMount(sheetEl);
}
function closeSheet(fromPop) {
  if (!sheetEl) return;
  sheetEl.remove(); sheetEl = null; formCtx = null;
  if (!fromPop && sheetPushed) { ignorePop++; try { history.back(); } catch (e) { ignorePop--; } }
  sheetPushed = false;
}
function confirmSheet(title, text, okLabel, fn, danger) {
  formCtx = { onOk: fn };
  openSheet(title, '<p>' + text + '</p>', '<button type="button" class="btn" data-a="close">Abbrechen</button><button type="button" class="btn ' + (danger ? 'dng' : 'pri') + '" data-a="confirm-ok">' + esc(okLabel) + '</button>');
}
function fieldHtml(f, vals) {
  const id = 'f-' + f.k, v = vals[f.k], lab = f.label ? '<label for="' + id + '">' + esc(f.label) + '</label>' : '';

  else if (f.type === 'text' || f.type === 'date' || f.type === 'month' || f.type === 'number') h = lab + '<input id="' + id + '" type="' + f.type + '" value="' + esc(v == null ? '' : v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + (f.type === 'number' ? ' inputmode="numeric"' : '') + (f.af ? ' data-af' : '') + ' autocomplete="off">';
  else if (f.type === 'area') h = lab + '<textarea id="' + id + '"' + (f.ro ? ' readonly' : '') + ' spellcheck="false">' + esc(v || '') + '</textarea>';
  else if (f.type === 'select') h = lab + '<select id="' + id + '">' + f.opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v == null ? '' : v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  else if (f.type === 'seg' || f.type === 'chips' || f.type === 'multi') {
    const on = o => (f.type === 'multi' ? (v || []).map(String).indexOf(String(o[0])) >= 0 : String(o[0]) === String(v));
    h = (f.label ? '<div class="lb" id="' + id + '-l">' + esc(f.label) + '</div>' : '') + '<div class="' + (f.type === 'seg' ? 'seg' : 'chips') + '" role="group"' + (f.label ? ' aria-labelledby="' + id + '-l"' : '') + '>' + f.opts.map(o => '<button type="button" class="' + (f.type === 'seg' ? '' : 'chip') + '" data-a="pick" data-k="' + f.k + '" data-v="' + esc(o[0]) + '" aria-pressed="' + on(o) + '">' + esc(o[1]) + '</button>').join('') + '</div>';
  } else if (f.type === 'toggle') h = '<label class="tog"><input id="' + id + '" type="checkbox"' + (v ? ' checked' : '') + '><span>' + esc(f.label) + (f.sub ? '<small>' + esc(f.sub) + '</small>' : '') + '</span></label>';
  else if (f.type === 'html') h = f.html;
  return '<div class="field" data-f="' + f.k + '">' + h + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
}
function openForm(cfg) {
  cfg.vals = cfg.vals || {};
  const body = '<form id="f" novalidate>' + cfg.fields.map(f => fieldHtml(f, cfg.vals)).join('') + (cfg.extra || '') + '<div class="field"><div class="err" id="f-err" role="alert"></div></div></form>';
  const foot = (cfg.del ? '<button type="button" class="btn dng" data-a="form-del">' + esc(cfg.del.label) + '</button>' : '') + '<button type="button" class="btn pri" data-a="form-ok">' + esc(cfg.submit || 'Speichern') + '</button>';
  openSheet(cfg.title, body, foot, el => { formCtx = cfg; syncForm(); const af = el.querySelector('[data-af]'); if (af) setTimeout(() => { try { af.focus(); } catch (e) { } }, 80); });
}
function formVals() {
  const cfg = formCtx, out = {};
  for (const f of cfg.fields) {
    const el = $('#f-' + f.k, sheetEl);
    if (f.type === 'amount') { out[f.k] = el.value.trim() === '' ? null : C.parseAmount(el.value); out[f.k + '_raw'] = el.value.trim(); }
    else if (f.type === 'toggle') out[f.k] = el.checked;
    else if (f.type === 'seg' || f.type === 'chips') { const b = $('[data-f="' + f.k + '"] [aria-pressed="true"]', sheetEl); out[f.k] = b ? b.dataset.v : ''; }
    else if (f.type === 'multi') out[f.k] = Array.prototype.map.call(sheetEl.querySelectorAll('[data-f="' + f.k + '"] [aria-pressed="true"]'), b => b.dataset.v);
    else if (f.type === 'html') continue;
    else out[f.k] = el.value;
  }
  return out;
}
function syncForm() {
  if (!formCtx || !formCtx.fields || !sheetEl) return;
  const v = formVals();
  for (const f of formCtx.fields) if (f.show) { const w = $('[data-f="' + f.k + '"]', sheetEl); if (w) w.hidden = !f.show(v); }

/* ---------- Buchung (Ausgabe / Einnahme) ---------- */
function txForm(id, preset) {
  const t = id ? S.tx.find(x => x.id === id) : null;
  const dflt = U.month === curM() ? today() : C.dateStr(U.month, C.dayOf(today()));
  const v = t ? { t: t.t, a: t.a, cat: t.t === 'exp' ? t.cat || '' : '', rcat: t.t === 'inc' ? t.cat || '' : '', ik: t.ik || 'geschenk', name: t.name, d: t.d, pot: t.pot || '', pay: t.pay || '', note: t.note || '' }
    : Object.assign({ t: 'exp', a: null, cat: '', rcat: '', ik: 'geschenk', name: '', d: dflt < S.meta.openDate ? S.meta.openDate : dflt, pot: '', pay: '', note: '' }, preset || {});
  const cats = S.cats.map(c => [c.id, c.name]);
  const pots = S.pots.filter(p => !p.arch || (t && t.pot === p.id)).map(p => [p.id, p.name + ' (' + C.fmt(comp.pots[p.id].balance) + ')']);
  openForm({
    title: t ? 'Buchung bearbeiten' : 'Neue Buchung', vals: v, submit: 'Speichern',
    fields: [
      { k: 't', type: 'seg', opts: [['exp', 'Ausgabe'], ['inc', 'Einnahme']] },
      { k: 'a', type: 'amount', label: 'Betrag', big: true, af: !t },
      { k: 'cat', type: 'chips', label: 'Kategorie', opts: cats, show: x => x.t === 'exp' },
      { k: 'ik', type: 'chips', label: 'Art der Einnahme', opts: ['geschenk', 'refund', 'sonder', 'lohn', 'neben', 'sonst'].map(k => [k, C.IKINDS[k]]), show: x => x.t === 'inc' },
      { k: 'rcat', type: 'select', label: 'Rückzahlung gehört zu', opts: [['', 'Keiner Kategorie – als Einnahme zählen']].concat(cats), hint: 'Mit Kategorie sinken dort die Ausgaben, zum Beispiel bei einer Retoure. Ohne Kategorie zählt der Betrag als Einnahme.', show: x => x.t === 'inc' && x.ik === 'refund' },
      { k: 'name', type: 'text', label: 'Bezeichnung (optional)', ph: 'z. B. Billa Einkauf' },
      { k: 'd', type: 'date', label: 'Datum', min: S.meta.openDate },
      { k: 'pot', type: 'select', label: 'Bezahlt aus', opts: [['', 'Freiem Geld (normales Monatsbudget)']].concat(pots), hint: 'Aus einem Sparbereich bezahlt: Der Sparbereich sinkt, dein freies Geld bleibt gleich.', show: x => x.t === 'exp' && pots.length > 0 },
      { k: 'pay', type: 'select', label: 'Zahlungsart (optional)', opts: Object.keys(C.PAYS).map(k => [k, k ? C.PAYS[k] : 'Keine Angabe']), show: x => x.t === 'exp' },
      { k: 'note', type: 'text', label: 'Notiz (optional)' }
    ],
    del: t ? { label: 'Löschen', fn: () => { const copy = Object.assign({}, t); closeSheet(); commit(s => { s.tx = s.tx.filter(x => x.id !== t.id); }, 'Buchung gelöscht', () => commit(s => { s.tx.push(copy); }, 'Wiederhergestellt')); } } : null,
    onSubmit(x) {
      const e = badAmount(x, 'a', 'Betrag'); if (e) return e;
      if (!C.validDate(x.d)) return 'Bitte ein gültiges Datum wählen.';
      if (x.d < S.meta.openDate) return 'Die Aufzeichnung beginnt am ' + C.fmtDate(S.meta.openDate) + '. Frühere Buchungen stecken schon im Startguthaben.';
      const isExp = x.t === 'exp';
      if (isExp && !x.cat) return 'Bitte eine Kategorie antippen.';
      if (isExp && x.pot) { const have = comp.pots[x.pot].balance + (t && t.pot === x.pot ? t.a : 0); if (x.a > have) return 'Im Sparbereich ' + potName(x.pot) + ' sind nur ' + C.fmt(have) + '. Trage den Rest als eigene Ausgabe aus dem freien Geld ein.'; }
      const o = { id: t ? t.id : C.id(), t: x.t, a: x.a, d: x.d, cat: isExp ? x.cat : (x.ik === 'refund' && x.rcat ? x.rcat : null), pot: isExp && x.pot ? x.pot : null, pay: isExp ? x.pay : '', ik: isExp ? '' : x.ik, note: x.note.trim(),
        name: x.name.trim() || (isExp ? catName(x.cat) : C.IKINDS[x.ik]) };

      commit(s => { if (t) s.tx[s.tx.indexOf(t)] = o; else s.tx.push(o); }, m === U.month ? 'Gespeichert' : 'Gespeichert im ' + C.monthName(m));
    }

}

}
function lastActive(vs) { for (let i = vs.length - 1; i >= 0; i--) if (!vs[i].paused && vs[i].amount > 0) return vs[i].amount; return 0; }

      { k: 'spread', type: 'toggle', label: 'Monatlich dafür zurücklegen', sub: 'Die Zahlung wird in gleiche Monatsteile aufgeteilt, damit der Fälligkeitsmonat nicht einbricht.', show: x => !isInc && +x.iv > 1 },

    ],

/* ---------- Sicherung, Export, Import ---------- */
async function saveFile(name, text, mime) {
  if (window.claude && window.claude.use) {
    try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: text }); return 'saved'; } }
    catch (e) { if (e && e.code === 'declined') return 'declined'; }
  }
  if (IS_FRAME) return 'nofile';
  try { const url = URL.createObjectURL(new Blob([text], { type: mime })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); return 'saved'; }
  catch (e) { return 'nofile'; }
}
const backupText = () => JSON.stringify({ app: 'geldblick', format: 1, exported: new Date().toISOString(), data: S });
const backupName = () => 'geldblick-sicherung-' + today() + '.json';

    const keys = chartKeys(W), H = 220, pl = 46, pr = 4, pt = 10, pb = 24, data = keys.map(k => { const R = comp.months[k]; return [R.income, R.spentAll, R.covered]; });
    const max = niceMax(Math.max.apply(null, [1].concat(data.map(d => Math.max(d[0], d[1], d[2])))));
    const iw = (W - pl - pr) / keys.length, bw = Math.max(3, Math.min(12, (iw - 12) / 3)), y = v => pt + (H - pt - pb) * (1 - Math.max(0, v) / max);
    let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Einnahmen, Ausgaben und Gespartes je Monat">';
    for (let i = 0; i <= 4; i++) { const yy = y(max * i / 4); s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (pl - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + C.num(max * i / 4, 0) + '</text>'; }
    keys.forEach((k, i) => {
      const cx = pl + iw * i + iw / 2, x0 = cx - (bw * 3 + 4) / 2;
      data[i].forEach((v, j) => { const yy = y(v), h = H - pb - yy; if (h > 0.5) { const x = x0 + j * (bw + 2), r = Math.min(4, bw / 2, h); s += '<path d="M' + x + ',' + (yy + h) + 'V' + (yy + r) + 'Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + yy + ' ' + (x + bw) + ',' + (yy + r) + 'V' + (yy + h) + 'Z" fill="var(--' + ['inc', 'exp', 'sav'][j] + ')"/>'; } });
      s += '<text x="' + cx + '" y="' + (H - 7) + '" text-anchor="middle">' + C.MON[+k.slice(5, 7) - 1] + '</text>';
      s += '<rect class="hit" tabindex="0" x="' + (pl + iw * i) + '" y="' + pt + '" width="' + iw + '" height="' + (H - pt - pb) + '" data-tip="' + esc('<b>' + C.monthName(k) + '</b>' + tipRow('Einnahmen', C.fmt(data[i][0])) + tipRow('Ausgaben', C.fmt(data[i][1])) + tipRow('Gespart', C.fmt(data[i][2]))) + '"/>';
    });
    return s + '</svg>';
  },
  wealth(W) {
    const keys = chartKeys(W), H = 200, pl = 46, pr = 14, pt = 14, pb = 24, vals = keys.map(k => comp.months[k].wealth);
    const hi = niceMax(Math.max.apply(null, [1].concat(vals))), mn = Math.min.apply(null, [0].concat(vals)), lo = mn < 0 ? -niceMax(-mn) : 0;
    const x = i => (keys.length === 1 ? pl + (W - pl - pr) / 2 : pl + (W - pl - pr) * i / (keys.length - 1)), y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
    let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Guthaben am Monatsende im Verlauf">';
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, yy = y(v); s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (pl - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + C.num(v, 0) + '</text>'; }
    const pts = vals.map((v, i) => x(i) + ',' + y(v));
    if (keys.length > 1) s += '<path d="M' + x(0) + ',' + y(Math.max(lo, 0)) + 'L' + pts.join('L') + 'L' + x(keys.length - 1) + ',' + y(Math.max(lo, 0)) + 'Z" fill="var(--sav)" fill-opacity=".12"/><path d="M' + pts.join('L') + '" fill="none" stroke="var(--sav)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const step = (W - pl - pr) / Math.max(1, keys.length - 1);
    keys.forEach((k, i) => {
      const R = comp.months[k], last = i === keys.length - 1;
      s += '<circle cx="' + x(i) + '" cy="' + y(vals[i]) + '" r="' + (last ? 5 : 3) + '" fill="var(--sav)" stroke="var(--surface)" stroke-width="2"/><text x="' + x(i) + '" y="' + (H - 7) + '" text-anchor="middle">' + C.MON[+k.slice(5, 7) - 1] + '</text>';
      const hx = Math.max(pl - 8, x(i) - step / 2), hw = Math.min(W - 1, x(i) + step / 2) - hx;
      s += '<rect class="hit" tabindex="0" x="' + hx + '" y="' + pt + '" width="' + hw + '" height="' + (H - pt - pb) + '" data-tip="' + esc('<b>Ende ' + C.monthName(k) + '</b>' + tipRow('Frei', C.fmt(R.available)) + tipRow('Sparbereiche', C.fmt(R.potsEnd)) + (R.reserveEnd ? tipRow('Rücklagen', C.fmt(R.reserveEnd)) : '') + tipRow('Gesamt', C.fmt(R.wealth))) + '"/>';
    });
    return s + '</svg>';
  }
};
